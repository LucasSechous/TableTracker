# Configuración de pytest (T26-140). Se corre desde `backend/`, con el venv activado:
#
#   pytest
#
# `pythonpath` agrega `backend/` (para `from app... import`, igual que hacen
# scripts/*.py insertándose a mano en sys.path) y `backend/tests/` (para poder
# importar `fixtures.rtsp_fake_server` desde cualquier archivo de test sin
# convertir `tests/` en un paquete con `__init__.py`).
[pytest]
testpaths = tests
pythonpath = . tests

# StarletteDeprecationWarning sobre TestClient/httpx: no hay nada que resolver
# de este lado (es la próxima versión de Starlette migrando de dependencia), y
# sin filtrarla se repite una vez por cada test que usa `client`.
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated.*
