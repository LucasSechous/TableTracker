# Configuración de Alembic (T26-137).
#
# Se corre desde la raíz del repo apuntando a este archivo:
#
#   alembic -c database/alembic.ini upgrade head
#
# La URL de la base NO va acá: es un secreto y este archivo se versiona. La pone
# env.py leyendo DATABASE_URL de backend/.env, igual que el resto de los scripts
# del proyecto.

[alembic]
# %(here)s es el directorio de este .ini, así que las revisiones se encuentran
# sin importar desde dónde se invoque el comando.
script_location = %(here)s
prepend_sys_path = .
path_separator = os

# sqlalchemy.url la define env.py desde DATABASE_URL. No la escribas acá.


[post_write_hooks]


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
